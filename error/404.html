<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        body { background-color: #1e1e2e; color: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .container { max-width: 400px; padding: 20px; }
        h1 { font-size: 72px; margin: 0; color: #cba6f7; }
        h2 { font-size: 24px; margin: 10px 0; }
        p { color: #a6adc8; font-size: 14px; margin-bottom: 30px; }
        a { display: inline-block; padding: 10px 20px; background-color: #cba6f7; color: #1e1e2e; text-decoration: none; border-radius: 8px; font-weight: bold; transition: opacity 0.2s; }
        a:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>页面未找到</h2>
        <p>您访问的页面不存在，或者已经被移动到其他位置。</p>
        <a href="/index.html">返回首页</a>
    </div>
</body>
</html>
