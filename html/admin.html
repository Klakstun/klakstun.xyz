<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>运维后台 · 一次性文件传输</title>
<style>
  :root {
    --md-primary: #6750a4;
    --md-on-primary: #fff;
    --md-primary-container: #eaddff;
    --md-on-primary-container: #21005d;
    --md-secondary-container: #e8def8;
    --md-on-secondary-container: #1d192b;
    --md-tertiary-container: #ffd8e4;
    --md-on-tertiary-container: #31111d;
    --md-error: #b3261e;
    --md-error-container: #f9dedc;
    --md-on-error-container: #410e0b;
    --md-success-container: #d7f0d2;
    --md-on-success-container: #0b3a10;
    --md-surface: #fef7ff;
    --md-surface-container-low: #f7f2fa;
    --md-surface-container: #f3edf7;
    --md-surface-container-high: #ece6f0;
    --md-on-surface: #1d1b20;
    --md-on-surface-variant: #49454f;
    --md-outline: #79747e;
    --md-outline-variant: #cac4d0;
    --radius-full: 999px;
    --radius-lg: 16px;
    --radius-xl: 28px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--md-surface); color: var(--md-on-surface);
    font-family: "Roboto", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }

  /* 顶部应用栏 */
  .appbar {
    position: sticky; top: 0; z-index: 10; height: 64px; padding: 0 8px 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--md-surface); border-bottom: 1px solid var(--md-outline-variant);
  }
  .appbar-title { font-size: 22px; font-weight: 400; }
  .appbar-actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 48px; height: 48px; border: none; border-radius: var(--radius-full);
    background: transparent; color: var(--md-on-surface-variant); font-size: 20px; cursor: pointer;
  }
  .icon-btn:hover { background: rgba(73,69,79,.08); }
  .icon-btn:active { background: rgba(73,69,79,.12); }

  /* 加载进度条 */
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 4px; z-index: 20; overflow: hidden; display: none; background: var(--md-primary-container); }
  .progress.on { display: block; }
  .progress::before {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--md-primary);
    border-radius: var(--radius-full); animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide { from { left: -40%; } to { left: 100%; } }

  main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }

  /* 卡片 */
  .card { background: var(--md-surface-container-low); border-radius: var(--radius-xl); padding: 20px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 500; }
  .card .sub { margin: 0 0 14px; color: var(--md-on-surface-variant); font-size: 13px; }

  /* 登录 */
  .login { max-width: 420px; margin: 24px auto 0; width: 100%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.08); }
  .login h1 { margin: 0 0 6px; font-size: 24px; font-weight: 400; }
  .field { position: relative; margin: 20px 0 8px; }
  .field input {
    width: 100%; height: 56px; padding: 0 16px; border: 1px solid var(--md-outline); border-radius: 4px;
    background: transparent; color: var(--md-on-surface); font-size: 16px; outline: none;
  }
  .field label {
    position: absolute; left: 12px; top: 16px; padding: 0 4px; background: #fff; color: var(--md-on-surface-variant);
    font-size: 16px; pointer-events: none; transition: all .15s;
  }
  .field input:focus { border: 2px solid var(--md-primary); padding: 0 15px; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { top: -9px; font-size: 12px; }
  .field input:focus + label { color: var(--md-primary); }
  .login-err { min-height: 20px; margin: 4px 0 12px; font-size: 13px; color: var(--md-error); white-space: pre-line; }

  /* 按钮 */
  .btn {
    position: relative; height: 40px; padding: 0 24px; border: none; border-radius: var(--radius-full);
    font-size: 14px; font-weight: 500; cursor: pointer; overflow: hidden; white-space: nowrap;
    background: var(--md-primary); color: var(--md-on-primary);
  }
  .btn:hover::before, .btn:active::before { content: ""; position: absolute; inset: 0; background: currentColor; }
  .btn:hover::before { opacity: .08; }
  .btn:active::before { opacity: .12; }
  .btn.tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .btn.outlined { background: transparent; color: var(--md-primary); border: 1px solid var(--md-outline); }
  .btn.block { width: 100%; }
  .btn:disabled { background: rgba(29,27,32,.12); color: rgba(29,27,32,.38); cursor: not-allowed; border-color: transparent; }
  .btn:disabled::before { display: none; }

  /* 标签 chip */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--md-outline-variant); font-size: 13px; color: var(--md-on-surface-variant); background: transparent;
  }
  .chip.ok { background: var(--md-success-container); color: var(--md-on-success-container); border-color: transparent; }
  .chip.bad { background: var(--md-error-container); color: var(--md-on-error-container); border-color: transparent; }

  /* 统计卡片 */
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { border-radius: var(--radius-lg); padding: 16px; background: var(--md-surface-container); }
  .stat .k { font-size: 12px; color: var(--md-on-surface-variant); }
  .stat .v { margin: 2px 0; font-size: 28px; font-weight: 400; line-height: 1.2; }
  .stat .n { font-size: 12px; color: var(--md-on-surface-variant); }
  .stat.primary { background: var(--md-primary-container); color: var(--md-on-primary-container); }
  .stat.primary .k, .stat.primary .n { color: var(--md-on-primary-container); opacity: .8; }
  .stat.warn { background: var(--md-error-container); color: var(--md-on-error-container); }
  .stat.warn .k, .stat.warn .n { color: var(--md-on-error-container); opacity: .8; }

  /* 键值列表 */
  .kv { display: grid; gap: 0; }
  .kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--md-outline-variant); }
  .kv > div:last-child { border-bottom: none; }
  .kv span:first-child { color: var(--md-on-surface-variant); white-space: nowrap; flex: none; }
  .kv span:last-child { text-align: right; word-break: break-all; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .result { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--md-surface-container); font-size: 13px; white-space: pre-line; }
  .result.bad { background: var(--md-error-container); color: var(--md-on-error-container); }
  .result.ok { background: var(--md-success-container); color: var(--md-on-success-container); }

  /* 文件列表 */
  .list { display: grid; }
  .item { padding: 12px 0; border-bottom: 1px solid var(--md-outline-variant); }
  .item:last-child { border-bottom: none; }
  .item-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item-id { font-size: 14px; }
  .item-meta { margin-top: 4px; font-size: 12px; color: var(--md-on-surface-variant); line-height: 1.6; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .st-active { background: var(--md-success-container); color: var(--md-on-success-container); }
  .st-uploading, .st-finishing { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .st-expired, .st-orphan_file, .st-orphan_state, .st-stuck { background: var(--md-error-container); color: var(--md-on-error-container); }
  .empty { padding: 16px 0; text-align: center; color: var(--md-on-surface-variant); }

  /* 开关 */
  .switch-row { display: flex; align-items: center; justify-content: space-between; }
  .switch { position: relative; width: 52px; height: 32px; flex: none; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 2; }
  .switch .track { position: absolute; inset: 0; border-radius: var(--radius-full); border: 2px solid var(--md-outline); background: var(--md-surface-container-high); transition: all .2s; }
  .switch .thumb { position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--md-outline); transition: all .2s; }
  .switch input:checked ~ .track { background: var(--md-primary); border-color: var(--md-primary); }
  .switch input:checked ~ .thumb { left: 24px; top: 4px; width: 24px; height: 24px; background: var(--md-on-primary); }

  .foot { padding: 4px 8px 32px; font-size: 12px; color: var(--md-on-surface-variant); line-height: 1.7; text-align: center; }

  /* 底部提示条 */
  .snackbar {
    position: fixed; left: 16px; right: 16px; bottom: 24px; max-width: 480px; margin: 0 auto; z-index: 30;
    padding: 14px 16px; border-radius: 4px; background: #322f35; color: #f5eff7; font-size: 14px;
    opacity: 0; transform: translateY(12px); pointer-events: none; transition: all .2s;
  }
  .snackbar.show { opacity: 1; transform: none; }
</style>
</head>
<body>
  <div class="progress" id="progress"></div>

  <header class="appbar">
    <div class="appbar-title">运维后台</div>
    <div class="appbar-actions">
      <button class="icon-btn" id="refreshBtn" aria-label="刷新" title="刷新" hidden>↻</button>
      <button class="icon-btn" id="logoutBtn" aria-label="退出" title="退出" hidden>✕</button>
    </div>
  </header>

  <main>
    <section class="card login" id="loginView">
      <h1>管理员登录</h1>
      <p class="sub">输入在 Cloudflare 中设置的 ADMIN_TOKEN。</p>
      <div class="field">
        <input id="pw" type="password" placeholder=" " autocomplete="current-password" />
        <label for="pw">管理密钥</label>
      </div>
      <div class="login-err" id="loginErr"></div>
      <button class="btn block" id="loginBtn">登录</button>
    </section>

    <div id="dash" hidden style="display:contents">
      <section class="card">
        <div class="chips" id="chips"></div>
      </section>

      <section class="stats" id="stats"></section>

      <section class="card">
        <h2>清理</h2>
        <p class="sub">每小时自动执行一次，也可以在这里手动触发。</p>
        <div class="kv" id="sweepInfo"></div>
        <div class="actions">
          <button class="btn" id="sweepBtn">立即清理</button>
        </div>
        <div class="result" id="sweepResult" hidden></div>
      </section>

      <section class="card">
        <h2>存储桶自检</h2>
        <p class="sub">写入、读取、删除一个临时对象，检查读写是否正常。</p>
        <div class="actions" style="margin-top:0">
          <button class="btn tonal" id="testBtn">运行自检</button>
        </div>
        <div class="result" id="testResult" hidden></div>
      </section>

      <section class="card">
        <h2>最近的文件</h2>
        <p class="sub" id="listSub"></p>
        <div class="list" id="list"></div>
      </section>

      <section class="card">
        <h2>配置与打包</h2>
        <p class="sub">各文件已打包进 Worker 的字符数，为 0 或为空说明该文件有问题。</p>
        <div class="kv" id="cfg"></div>
      </section>

      <section class="card">
        <div class="switch-row">
          <div>
            <h2 style="margin:0">自动刷新</h2>
            <div class="sub" style="margin:0">每 30 秒刷新一次，会产生少量 R2 读取操作</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="autoSwitch" />
            <span class="track"></span><span class="thumb"></span>
          </label>
        </div>
      </section>

      <div class="foot">
        此页面不会显示文件名，密钥只显示前 4 位。<br />
        <span id="verText"></span>
      </div>
    </div>
  </main>

  <div class="snackbar" id="snackbar"></div>

  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    let pw = sessionStorage.getItem("adm") || "";
    let timer = null;
    let snackTimer = null;

    const STATUS = {
      active: "有效", expired: "已过期", uploading: "上传中", finishing: "收尾中",
      orphan_file: "孤立文件", orphan_state: "孤立状态", stuck: "下载卡住",
    };

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    function snack(msg) {
      const s = $("snackbar");
      s.textContent = msg; s.classList.add("show");
      clearTimeout(snackTimer);
      snackTimer = setTimeout(() => s.classList.remove("show"), 2600);
    }
    function loading(on) { $("progress").classList.toggle("on", !!on); }

    function fmtBytes(n) {
      if (!n) return "0 B";
      const u = ["B", "KB", "MB", "GB", "TB"];
      let i = 0; n = Number(n);
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + " " + u[i];
    }
    function fmtTime(ms) {
      if (!ms) return "-";
      return new Date(ms).toLocaleString("zh-CN", { hour12: false });
    }
    function fmtDur(ms) {
      ms = Math.abs(ms);
      const m = Math.floor(ms / 60000);
      if (m < 1) return "不到 1 分钟";
      if (m < 60) return m + " 分钟";
      const h = Math.floor(m / 60);
      if (h < 48) return h + " 小时" + (m % 60 ? " " + (m % 60) + " 分" : "");
      return Math.floor(h / 24) + " 天 " + (h % 24) + " 小时";
    }

    async function api(path, method) {
      const r = await fetch(path, { method: method || "GET", headers: { authorization: "Bearer " + pw } });
      let d = {};
      try { d = await r.json(); } catch (e) {}
      if (!r.ok) {
        const err = new Error(d.error || ("请求失败（" + r.status + "）"));
        err.code = r.status;
        throw err;
      }
      return d;
    }

    function stopAuto() { if (timer) { clearInterval(timer); timer = null; } $("autoSwitch").checked = false; }

    function showLogin(msg) {
      $("dash").hidden = true; $("loginView").hidden = false;
      $("refreshBtn").hidden = true; $("logoutBtn").hidden = true;
      stopAuto();
      $("loginErr").textContent = msg || "";
    }
    function showDash() {
      $("loginView").hidden = true; $("dash").hidden = false;
      $("refreshBtn").hidden = false; $("logoutBtn").hidden = false;
      $("loginErr").textContent = "";
    }

    const SETUP_HELP =
      "服务端还没有设置 ADMIN_TOKEN。\n" +
      "Cloudflare 控制台 → Workers & Pages → 你的 Worker → Settings → Variables and Secrets → Add，类型选 Secret，名称填 ADMIN_TOKEN，值填一串 20 位以上的随机字符，保存后重新部署。";

    function render(d) {
      const c = d.counts || {};
      const g = (k) => c[k] || 0;
      const pending = g("expired") + g("orphan_file") + g("orphan_state") + g("stuck");
      const busy = g("uploading") + g("finishing");

      // 状态标签
      const chips = $("chips"); chips.textContent = "";
      const s = d.server || {};
      const addChip = (text, cls) => chips.appendChild(el("span", "chip " + (cls || ""), text));
      addChip("版本 " + (s.version || "-"), "");
      addChip(s.bucketBound ? "存储桶已绑定" : "存储桶未绑定", s.bucketBound ? "ok" : "bad");
      addChip("定时清理 " + (s.cron || "-"), "");
      if (d.truncated) addChip("对象过多，仅统计前 10000 个", "bad");

      // 统计
      const stats = $("stats"); stats.textContent = "";
      const addStat = (cls, k, v, n) => {
        const b = el("div", "stat " + cls);
        b.appendChild(el("div", "k", k));
        b.appendChild(el("div", "v", v));
        b.appendChild(el("div", "n", n));
        stats.appendChild(b);
      };
      addStat("primary", "待下载的文件", String(g("active")), "共 " + d.total + " 组对象");
      addStat("", "占用空间", fmtBytes(d.totalBytes), d.oldest ? "最早上传 " + fmtTime(d.oldest) : "桶内没有文件");
      addStat(pending ? "warn" : "", "待清理", String(pending), pending ? "点下方“立即清理”处理" : "没有残留");
      addStat("", "进行中", String(busy), "上传中或最后一次下载中");

      // 清理信息
      const sw = $("sweepInfo"); sw.textContent = "";
      const addKV = (box, k, v) => {
        const row = el("div");
        row.appendChild(el("span", "", k));
        row.appendChild(el("span", "", v));
        box.appendChild(row);
      };
      const ls = d.lastSweep;
      if (ls) {
        addKV(sw, "最近一次", fmtTime(ls.at) + "（" + fmtDur(d.now - ls.at) + "前，" + (ls.trigger === "cron" ? "定时" : "手动") + "）");
        addKV(sw, "扫描对象", String(ls.scanned));
        addKV(sw, "删除", "过期 " + ls.expired + " · 孤立 " + ls.orphans + " · 卡住 " + ls.stuck);
      } else {
        addKV(sw, "最近一次", "还没有记录（等待下一个整点或手动清理）");
      }

      // 文件列表
      const list = $("list"); list.textContent = "";
      $("listSub").textContent = d.total > d.list.length
        ? "显示最近 " + d.list.length + " 条，共 " + d.total + " 条"
        : "共 " + d.total + " 条";
      if (!d.list.length) list.appendChild(el("div", "empty", "桶里目前没有文件"));
      d.list.forEach((it) => {
        const row = el("div", "item");
        const top = el("div", "item-top");
        top.appendChild(el("span", "item-id mono", it.id));
        top.appendChild(el("span", "tag st-" + it.status, STATUS[it.status] || it.status));
        row.appendChild(top);

        const parts = [fmtBytes(it.size), "上传于 " + fmtTime(it.uploaded)];
        if (it.remaining !== null && it.maxDownloads !== null) parts.push("剩余次数 " + it.remaining + "/" + it.maxDownloads);
        if (it.expiresAt) {
          const left = it.expiresAt - d.now;
          parts.push(left > 0 ? "还剩 " + fmtDur(left) : "已过期 " + fmtDur(left));
        } else {
          parts.push("无到期信息");
        }
        row.appendChild(el("div", "item-meta", parts.join(" · ")));
        list.appendChild(row);
      });

      // 配置与打包
      const cfg = $("cfg"); cfg.textContent = "";
      const lim = s.limits || {};
      addKV(cfg, "下载次数上限", String(lim.maxDownloads));
      addKV(cfg, "最长保留", (lim.maxTtlHours / 24) + " 天");
      addKV(cfg, "进行中宽限期", lim.graceHours + " 小时");
      addKV(cfg, "旧文件最长保留", lim.legacyMaxDays + " 天");
      Object.keys(s.bundle || {}).forEach((k) => {
        const v = s.bundle[k];
        addKV(cfg, k, v ? v + " 字符" : "异常（空）");
      });

      $("verText").textContent = "Worker " + (s.version || "-") + " · 刷新于 " + fmtTime(d.now);
    }

    async function load() {
      loading(true);
      try {
        const d = await api("/admin/api/stats");
        render(d);
        showDash();
        return true;
      } catch (e) {
        if (e.code === 401) {
          sessionStorage.removeItem("adm"); pw = "";
          showLogin("密钥错误或已失效");
        } else if (e.code === 503) {
          showLogin(SETUP_HELP);
        } else if ($("dash").hidden) {
          showLogin(e.message);
        } else {
          snack(e.message);
        }
        return false;
      } finally {
        loading(false);
      }
    }

    // 登录
    async function login() {
      const v = $("pw").value.trim();
      if (!v) { $("loginErr").textContent = "请输入密钥"; return; }
      pw = v;
      $("loginBtn").disabled = true;
      const ok = await load();
      $("loginBtn").disabled = false;
      if (ok) { sessionStorage.setItem("adm", pw); $("pw").value = ""; }
    }
    $("loginBtn").addEventListener("click", login);
    $("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

    $("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("adm"); pw = "";
      showLogin("");
      snack("已退出");
    });
    $("refreshBtn").addEventListener("click", async () => { if (await load()) snack("已刷新"); });

    // 立即清理
    $("sweepBtn").addEventListener("click", async () => {
      const box = $("sweepResult");
      $("sweepBtn").disabled = true; loading(true);
      try {
        const r = await api("/admin/api/sweep", "POST");
        box.hidden = false; box.className = "result ok";
        box.textContent = "清理完成：扫描 " + r.scanned + " 个，删除过期 " + r.expired + "、孤立 " + r.orphans + "、卡住 " + r.stuck + (r.truncated ? "\n对象过多，本次只处理了前 10000 个" : "");
        await load();
      } catch (e) {
        box.hidden = false; box.className = "result bad"; box.textContent = "清理失败：" + e.message;
      } finally {
        $("sweepBtn").disabled = false; loading(false);
      }
    });

    // 自检
    $("testBtn").addEventListener("click", async () => {
      const box = $("testResult");
      $("testBtn").disabled = true; loading(true);
      try {
        const r = await api("/admin/api/selftest", "POST");
        box.hidden = false;
        if (r.ok) {
          box.className = "result ok";
          box.textContent = "读写正常\n写入 " + r.putMs + " ms · 读取 " + r.getMs + " ms · 删除 " + r.deleteMs + " ms";
        } else {
          box.className = "result bad";
          box.textContent = "自检失败：" + (r.error || ("读回=" + r.readBack + "，已删除=" + r.deleted));
        }
      } catch (e) {
        box.hidden = false; box.className = "result bad"; box.textContent = "自检失败：" + e.message;
      } finally {
        $("testBtn").disabled = false; loading(false);
      }
    });

    // 自动刷新
    $("autoSwitch").addEventListener("change", (e) => {
      if (timer) { clearInterval(timer); timer = null; }
      if (e.target.checked) timer = setInterval(load, 30000);
    });

    if (pw) load(); else showLogin("");
  })();
  </script>
</body>
</html>
