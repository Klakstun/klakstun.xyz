<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>一次性文件传输</title>
<style>
  :root {
    --md-primary: #6750a4;
    --md-on-primary: #fff;
    --md-primary-container: #eaddff;
    --md-on-primary-container: #21005d;
    --md-surface: #fef7ff;
    --md-on-surface: #1d1b20;
    --md-surface-variant: #e7e0ec;
    --md-on-surface-variant: #49454f;
    --md-outline: #79747e;
    --radius-full: 999px;
    --radius-md: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center; padding: 24px;
    background: var(--md-surface); color: var(--md-on-surface);
    font-family: "Roboto", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 28px; font-weight: 500; margin: 0 0 8px; }
  .subtitle { font-size: 14px; color: var(--md-on-surface-variant); margin: 0 0 28px; line-height: 1.6; }
  .cards { display: grid; gap: 16px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #fff; border-radius: 24px; padding: 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 12px rgba(0,0,0,.08);
    transition: transform .15s, box-shadow .15s;
  }
  a.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 2px 6px rgba(0,0,0,.14), 0 8px 20px rgba(0,0,0,.10);
  }
  .card-icon {
    width: 48px; height: 48px; border-radius: var(--radius-full);
    background: var(--md-primary-container); color: var(--md-on-primary-container);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; margin-bottom: 14px;
  }
  .card-title { font-size: 18px; font-weight: 500; margin: 0 0 6px; }
  .card-desc { font-size: 14px; color: var(--md-on-surface-variant); margin: 0; line-height: 1.5; }
  .foot { margin-top: 28px; font-size: 13px; color: var(--md-on-surface-variant); line-height: 1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>一次性文件传输</h1>
    <p class="subtitle">上传文件生成密钥，对方凭密钥下载一次后自动销毁。无需注册。</p>

    <div class="cards">
      <a class="card" href="/upload">
        <div class="card-icon">↑</div>
        <p class="card-title">上传文件</p>
        <p class="card-desc">选择文件，生成一次性下载密钥。</p>
      </a>
      <a class="card" href="/download">
        <div class="card-icon">↓</div>
        <p class="card-title">下载文件</p>
        <p class="card-desc">输入密钥，下载对方分享的文件（仅一次）。</p>
      </a>
    </div>

    <p class="foot">文件仅可下载一次，下载后即从服务器删除。</p>
  </div>
</body>
</html>
