<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>一次性文件传输</title>
<link rel="stylesheet" href="/css/common.css" />
<link rel="stylesheet" href="/css/index.css" />
</head>
<body>
  <div class="wrap">
    <h1>一次性文件传输</h1>
    <p class="subtitle">上传文件生成密钥，对方凭密钥下载一次后自动销毁。无需注册。</p>

    <div class="cards">
      <a class="card" href="/upload">
        <div class="card-icon">↑</div>
        <p class="card-title">上传文件</p>
        <p class="card-desc">选择文件，生成一次性下载密钥。</p>
      </a>
      <a class="card" href="/download">
        <div class="card-icon">↓</div>
        <p class="card-title">下载文件</p>
        <p class="card-desc">输入密钥，下载对方分享的文件（仅一次）。</p>
      </a>
    </div>

    <p class="foot">文件仅可下载一次，下载后即从服务器删除。</p>
  </div>
</body>
</html>
